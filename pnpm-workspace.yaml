packages:
  - "apps/*"
  - "packages/*"
# browserslist <=4.28.6 carries two high advisories and reaches us only as a
# transitive of next > styled-jsx > @babel/*. Nothing here depends on it
# directly, so a patch-level floor is the whole fix; drop this once the
# upstream chain ships a patched range on its own.
overrides:
  browserslist: ">=4.28.7"
  # source-map-js <1.2.2 (event-loop DoS) arrives via next > postcss; same
  # story as browserslist: a floor until postcss requires a patched range.
  source-map-js: ">=1.2.2"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild
