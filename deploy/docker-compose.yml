# EnvHQ, self-hosted — the app and its database.
#
#   cp deploy/envhq.env.example deploy/envhq.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, your load balancer) in
# front of port 3000 and set ENVHQ_PUBLIC_URL to the https URL people use.
# Backups: back up the Postgres volume. It holds ciphertext only.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: envhq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: envhq
    volumes:
      - envhq-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envhq -d envhq"]
      interval: 5s
      timeout: 3s
      retries: 20

  envhq:
    image: ${ENVHQ_IMAGE:-ghcr.io/envhq/envhq:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: envhq.env
    environment:
      DATABASE_URL: postgres://envhq:${POSTGRES_PASSWORD}@db:5432/envhq
    ports:
      - "3000:3000"

volumes:
  envhq-db:
