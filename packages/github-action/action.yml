name: EnvHQ
description: Load an EnvHQ environment into your job — decrypted on the runner, masked before it can reach a log.
author: EnvHQ
branding:
  icon: lock
  color: green

inputs:
  token:
    description: The deploy key's API token (store it as a secret, e.g. ENVHQ_TOKEN). Fetches ciphertext; decrypts nothing on its own.
    required: true
  key:
    description: The deploy key (store it as a secret, e.g. ENVHQ_DEPLOY_KEY). Decrypts on the runner; EnvHQ never sees it.
    required: true
  project:
    description: Project name or id.
    required: true
  environment:
    description: Environment name, e.g. staging.
    required: true
  format:
    description: >-
      Where the values go. `env` — environment variables for every later step in this job.
      `outputs` — step outputs, read as steps.<id>.outputs.<NAME>. `dotenv` — a .env file at `path`.
    required: false
    default: env
  mask:
    description: Register every value with the log masker before anything else runs. Only turn this off for values that aren't secret.
    required: false
    default: "true"
  required:
    description: >-
      Variable names this job can't run without, separated by commas or newlines. The step fails,
      exporting nothing, if any is missing or empty — so a typo or a deleted variable stops the job
      here instead of reaching a later step as an unset variable.
    required: false
    default: ""
  path:
    description: File to write when format is `dotenv`.
    required: false
    default: .env

runs:
  using: node24
  main: dist/index.cjs
