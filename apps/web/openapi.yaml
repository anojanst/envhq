        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/TeamError'
        "404":
          $ref: '#/components/responses/TeamNotFound'
    post:
      tags: [Orgs]
      operationId: createTeamInvite
      summary: Create a single-use invite link
      description: >-
        Team admins only. The link (`url`) is in this response and nowhere
        else — only a hash of its token is stored. Expires after 7 days.
        Refused (409) for a personal workspace.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  enum: [admin, member]
                  default: member
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [invite, url]
                properties:
                  invite:
                    $ref: '#/components/schemas/OrgInvite'
                  url:
                    type: string
                    format: uri
        "400":
          $ref: '#/components/responses/TeamError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/TeamError'
        "404":
          $ref: '#/components/responses/TeamNotFound'
        "409":
          $ref: '#/components/responses/TeamError'
  /api/orgs/{id}/invites/{inviteId}:
    delete:
      tags: [Orgs]
      operationId: revokeTeamInvite
      summary: Revoke a pending invite link
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/TeamError'
        "404":
          description: Team not found, or no such pending invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/invites/accept:
    post:
      tags: [Orgs]
      operationId: acceptTeamInvite
      summary: Join a team with an invite link's token
      description: >-
        Single use. Someone already in the team keeps their current role.
        Needs a web session or a full, unscoped write token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                required: [orgId]
                properties:
                  orgId:
                    type: string
        "400":
          $ref: '#/components/responses/TeamError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/TeamError'
        "404":
          description: The link is invalid, expired or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/projects/{id}/access/{grantId}:
    delete:
      tags: [Projects]
      operationId: deleteProjectAccessGrant
      summary: Revoke an access grant
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found (or caller isn't admin), or grant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                projectNotFound:
                  value: { error: Project not found }
                grantNotFound:
                  value: { error: Grant not found }
  /api/projects/{id}/access/groups:
    get:
      tags: [Projects]
      operationId: listProjectAccessGroupOptions
      summary: List the project's org's groups, for the Share dialog's group picker
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/access/members:
    get:
      tags: [Projects]
      operationId: listProjectAccessMemberOptions
      summary: List the project's org's members, for the Share dialog's user picker
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgMember'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/access:
    get:
      tags: [Projects]
      operationId: listProjectAccess
      summary: List a project's access grants and environments
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [grants, environments]
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessGrant'
                  environments:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
    post:
      tags: [Projects]
      operationId: upsertProjectAccess
      summary: Grant (or update) a user's or group's role on a project
      description: >-
        Always returns 201, even when updating an existing grant's role.
        `envScope` is only applied when the key is present in the request
        body at all — omitting it leaves an existing grant's env-scope
        untouched; `null` or `{}` explicitly clears it.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, role]
              properties:
                subjectType:
                  $ref: '#/components/schemas/SubjectType'
                  default: user
                subjectId:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                envScope:
                  $ref: '#/components/schemas/EnvScope'
      responses:
        "201":
          description: Grant created or updated.
          content:
            application/json:
              schema:
                type: object
                required: [grant]
                properties:
                  grant:
                    $ref: '#/components/schemas/AccessGrant'
        "400":
          description: Invalid subjectId, role, envScope, or a subject that doesn't belong to this project's org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                subjectIdRequired:
                  value: { error: subjectId is required }
                invalidRole:
                  value: { error: "role must be one of viewer, editor, admin" }
                userNotInOrg:
                  value: { error: "That user isn't a member of this project's org" }
                groupNotInOrg:
                  value: { error: "That group doesn't belong to this project's org" }
                invalidEnvScope:
                  value: { error: "envScope must map real environment names to a role no higher than the grant's own role" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/environments:
    post:
      tags: [Projects]
      operationId: createProjectEnvironment
      summary: Create an environment in a project, optionally cloning another's variables
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                from:
                  type: string
                  format: uuid
                  description: Source environment id to clone ciphertext from (no re-encryption).
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [environment]
                properties:
                  environment:
                    $ref: '#/components/schemas/Environment'
        "400":
          description: name missing, or `from` doesn't belong to this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameRequired:
                  value: { error: name is required }
                sourceNotFound:
                  value: { error: Source environment not found in this project }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
        "409":
          description: An environment with this name already exists in the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: An environment named "staging" already exists in this project
  /api/projects/{id}/keys/me:
    get:
      tags: [Projects]
      operationId: getMyProjectKey
      summary: Fetch the caller's own wrapped DEK for a project
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [wrappedDek]
                properties:
                  wrappedDek:
                    type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or no key is registered for the caller yet.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/ProjectKeyNotFound'
              examples:
                projectNotFound:
                  value: { error: Project not found }
                noKeyYet:
                  value: { error: "No key registered for you on this project yet", anyKeyExists: true }
  /api/projects/{id}/deploy-keys:
    get:
      tags: [Projects]
      operationId: listDeployKeys
      summary: List a project's deploy keys
      description: >-
        Includes revoked keys — a revoked key is part of the audit trail.
        Admin-only.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [deployKeys]
                properties:
                  deployKeys:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeployKey'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
    post:
      tags: [Projects]
      operationId: createDeployKey
      summary: Issue a deploy key
      description: >-
        The keypair is generated in the browser and only the public half is
        sent. There is no field for the private half: the server does not
        receive it, cannot store it, and cannot show it again. The API token
        is returned in the clear exactly once, here.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, publicKey, wrappedDek]
              properties:
                label:
                  type: string
                  description: What this key is for, so nobody is afraid to revoke it.
                publicKey:
                  type: string
                  description: Base64 X25519 public half.
                wrappedDek:
                  type: string
                  description: The project DEK sealed to `publicKey`, client-side.
                environmentId:
                  type: [string, "null"]
                  format: uuid
                  description: >-
                    Restricts which environment the API will serve to this
                    key. An authorization cap, **not** an isolation boundary:
                    DEKs are per project, so the key itself opens every
                    environment in it.
      responses:
        "201":
          description: Issued. The token is shown once and is not retrievable.
          content:
            application/json:
              schema:
                type: object
                required: [id, label, publicKey, createdAt, token]
                properties:
                  id:
                    type: string
                    format: uuid
                  label:
                    type: string
                  environmentId:
                    type: [string, "null"]
                    format: uuid
                  publicKey:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  token:
                    type: string
        "400":
          description: A required field was missing, or the environment isn't this project's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: label is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A read-only token may not issue a credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token is read-only.
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/deploy-keys/{keyId}:
    delete:
      tags: [Projects]
      operationId: revokeDeployKey
      summary: Revoke a deploy key
      description: >-
        Drops its DEK wrap, deletes its API token and flags the project for
        rotation — one action, because a holder left with a live token keeps
        reading ciphertext indefinitely. Revocation does not make already
        copied ciphertext safe; rotating the project DEK afterwards is
        mandatory.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok, rotationRequired]
                properties:
                  ok:
                    type: boolean
                  rotationRequired:
                    type: boolean
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A read-only token may not revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token is read-only.
        "404":
          description: Project or deploy key not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Deploy key not found
  /api/projects/{id}/keys/members:
    get:
      tags: [Projects]
      operationId: listProjectKeyMembers
      summary: List every authorized member who already holds a key wrap
      description: Used to rewrap-for-everyone on rotation.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [members, deployKeys, totalAccessible]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMemberKey'
                  deployKeys:
                    type: array
                    description: >-
                      Active deploy keys, which are part of the expected wrap
                      set. A rotation that omits them is rejected.
                    items:
                      type: object
                      required: [subjectId, publicKey, label]
                      properties:
                        subjectId:
                          type: string
                        publicKey:
                          type: string
                        label:
                          type: string
                  totalAccessible:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/keys/pending:
    get:
      tags: [Projects]
      operationId: listPendingProjectKeyMembers
      summary: List authorized members who lack a key wrap yet
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectMemberKey'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/keys/rotate/finalize:
    post:
      tags: [Projects]
      operationId: finalizeProjectKeyRotation
      summary: Complete a DEK rotation
      description: >-
        The irreversible step: swaps every `project_keys` wrap to the new
        DEK and bumps `projects.keyVersion`. Only proceeds once every
        `env_vars` row is confirmed re-encrypted, and only accepts a wrap
        set that exactly matches the project's real current membership.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKeyVersion, wraps]
              properties:
                targetKeyVersion:
                  type: integer
                  minimum: 1
                wraps:
                  type: array
                  items:
                    type: object
                    required: [subjectUserId, wrappedDek]
                    properties:
                      subjectUserId:
                        type: string
                      wrappedDek:
                        type: string
      responses:
        "200":
          description: Rotation finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: Invalid targetKeyVersion or wraps shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                targetKeyVersion:
                  value: { error: targetKeyVersion must be a positive integer }
                wrapsShape:
                  value: { error: "wraps must be an array of {subjectUserId, wrappedDek}" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
        "409":
          description: Some variables still need migrating, or the supplied wraps don't match current membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                pendingMigration:
                  value: { error: "3 value(s) still need migrating before finalize" }
                membershipMismatch:
                  value: { error: "The supplied key wraps don't match the project's current members — refresh and try again" }
  /api/projects/{id}/keys/rotate:
    post:
      tags: [Projects]
      operationId: migrateProjectKeyBatch
      summary: Re-encrypt a batch of variables under a new DEK generation
      description: >-
        Chunked, idempotent/resumable batch step of a rotation. Doesn't
        touch `project_keys` or bump `projects.keyVersion` — see `finalize`.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKeyVersion, rows]
              properties:
                targetKeyVersion:
                  type: integer
                  minimum: 1
                rows:
                  type: array
                  items:
                    type: object
                    required: [id, ciphertext, iv]
                    properties:
                      id:
                        type: string
                        format: uuid
                      ciphertext:
                        type: string
                      iv:
                        type: string
      responses:
        "200":
          description: Batch migrated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, migrated]
                properties:
                  ok:
                    const: true
                  migrated:
                    type: integer
        "400":
          description: Invalid targetKeyVersion or rows shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                targetKeyVersion:
                  value: { error: targetKeyVersion must be a positive integer }
                rowsShape:
                  value: { error: "rows must be an array of {id, ciphertext, iv}" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/keys/rotation-status:
    get:
      tags: [Projects]
      operationId: getProjectKeyRotationStatus
      summary: Fetch a project's current DEK generation and whether rotation is recommended
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects/{id}/keys:
    post:
      tags: [Projects]
      operationId: registerProjectKey
      summary: Register a wrapped DEK, for the caller or (with editor role) another authorized member
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrappedDek]
              properties:
                wrappedDek:
                  type: string
                subjectUserId:
                  type: string
                  description: Defaults to the caller. Registering for someone else requires editor role.
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: wrappedDek missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: wrappedDek is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The read-only PAT gate, or the target user doesn't have project access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                readOnly:
                  value: { error: This token is read-only. }
                targetNoAccess:
                  value: { error: "That user doesn't have access to this project" }
        "404":
          description: Project not found, or caller doesn't meet the required role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
        "409":
          description: >-
            A key is already registered for that user on this project, or the
            caller is self-registering while someone else already holds the
            project's key (only a project's first key may be self-registered;
            later members get theirs wrapped for them).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A key is already registered for that user on this project
  /api/projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Fetch a project and its environments
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [project, environments]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Environment'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
    patch:
      tags: [Projects]
      operationId: renameProject
      summary: Rename a project
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        "400":
          description: name missing/blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: name is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
        "409":
          description: Another project in the org already has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A project named "Payments" already exists.
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller lacks admin role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects the caller can access in an org
      description: CLI-only surface — the web dashboard reads `lib/access.ts` directly instead.
      parameters:
        - $ref: '#/components/parameters/orgIdQueryParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller isn't a member of the requested org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: "You're not a member of that org."
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project, its initial environments, and any initial access grants
      description: >-
        The creator always receives an explicit admin grant, in addition to
        any `grants` requested. Defaults to a single `dev` environment;
        passing an empty `environments` array opts out entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                orgId:
                  type: string
                grants:
                  type: array
                  items:
                    type: object
                    required: [subjectId, role]
                    properties:
                      subjectType:
                        $ref: '#/components/schemas/SubjectType'
                        default: user
                      subjectId:
                        type: string
                      role:
                        $ref: '#/components/schemas/Role'
                environments:
                  type: array
                  default: [dev]
                  items:
                    type: string
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [project, environments]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Environment'
        "400":
          description: Invalid name, or an initial grant's subject/role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameRequired:
                  value: { error: name is required }
                grantShape:
                  value: { error: Each grant needs a subjectId and a valid role }
                grantUserNotInOrg:
                  value: { error: "A granted user isn't a member of this org" }
                grantGroupNotInOrg:
                  value: { error: "A granted group doesn't belong to this org" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The token can't create projects, or the caller isn't a member of the requested org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tokenScoped:
                  value: { error: This token can't create projects. }
                notOrgMember:
                  value: { error: "You're not a member of that org." }
        "409":
          description: A project with this name already exists in the org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A project named "Payments" already exists.
  /api/tokens/{id}:
    delete:
      tags: [Tokens]
      operationId: deleteToken
      summary: Revoke one of the caller's own tokens
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A scoped/read-only token attempted to manage tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token can't manage tokens.
        "404":
          description: Token not found, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Token not found
  /api/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List the caller's own tokens
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Create a new personal access token
      description: The plaintext secret is returned exactly once, in this response only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                capability:
                  type: string
                  enum: [read, write]
                  default: write
                projectId:
                  type: string
                  format: uuid
                  description: Scopes the token to one project. Omit for an all-projects token.
                expiresInDays:
                  type: number
                  description: Omit or non-positive for a non-expiring token.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        "400":
          description: name missing, or projectId doesn't resolve to an accessible project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameRequired:
                  value: { error: name is required }
                unknownProject:
                  value: { error: Unknown project }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A scoped/read-only token attempted to create another token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token can't create tokens.
  /api/users/me/keys:
    get:
      tags: [Users]
      operationId: getMyUserKeys
      summary: Fetch the caller's zero-knowledge identity material
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserKeysPublic'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The caller hasn't completed zero-knowledge onboarding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Zero-knowledge identity not set up
    post:
      tags: [Users]
      operationId: createMyUserKeys
      summary: One-time creation of the caller's zero-knowledge identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicKey
                - kdfSalt
                - kdfT
                - kdfM
                - kdfP
                - wrappedPrivateKey
                - wrappedPrivateKeyNonce
                - wrappedPrivateKeyByRecovery
                - wrappedPrivateKeyByRecoveryNonce
              properties:
                publicKey:
                  type: string
                kdfSalt:
                  type: string
                kdfT:
                  type: integer
                kdfM:
                  type: integer
                kdfP:
                  type: integer
                wrappedPrivateKey:
                  type: string
                wrappedPrivateKeyNonce:
                  type: string
                wrappedPrivateKeyByRecovery:
                  type: string
                wrappedPrivateKeyByRecoveryNonce:
                  type: string
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: Missing or invalid key material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Missing or invalid key material
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: The caller already has a zero-knowledge identity (no update path — one-time only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Zero-knowledge identity already set up
  /api/vars/{id}:
    patch:
      tags: [Vars]
      operationId: updateVar
      summary: Update a variable's key and/or value
      description: >-
        All fields optional, but at least one of `key` or (`ciphertext` +
        `iv`) must be present. A rename to a key that collides with another
        active variable in the same environment is pre-checked and returned
        as a 409 before touching the version counter.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                ciphertext:
                  type: string
                iv:
                  type: string
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [variable]
                properties:
                  variable:
                    type: object
                    required: [id, key]
                    properties:
                      id:
                        type: string
                        format: uuid
                      key:
                        type: string
        "400":
          description: Invalid key format, or no fields to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidKey:
                  value: { error: Invalid key format }
                nothingToUpdate:
                  value: { error: Nothing to update }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Variable not found, or caller lacks editor role on its environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Variable not found
        "409":
          description: The new key collides with an existing variable, or the environment changed underneath this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                keyCollision:
                  value: { error: A variable with that key already exists in this environment }
                versionConflict:
                  value: { error: This environment changed elsewhere — refresh and try again. }
    delete:
      tags: [Vars]
      operationId: deleteVar
      summary: Soft-delete a variable
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Variable not found, or caller lacks editor role on its environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Variable not found
        "409":
          description: The environment changed underneath this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
