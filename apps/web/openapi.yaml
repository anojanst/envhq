              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                subjectIdRequired:
                  value: { error: subjectId is required, code: bad_request }
                invalidRole:
                  value: { error: "role must be one of viewer, editor, admin", code: bad_request }
                userNotInOrg:
                  value: { error: "That user isn't a member of this project's org", code: bad_request }
                groupNotInOrg:
                  value: { error: "That group doesn't belong to this project's org", code: bad_request }
                invalidEnvScope:
                  value: { error: "envScope must map real environment names to a role no higher than the grant's own role", code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
