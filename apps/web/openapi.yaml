        "400":
          description: name missing/blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: name is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller isn't org-admin.
          content:
            application/json:
