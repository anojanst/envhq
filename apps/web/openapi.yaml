                      $ref: '#/components/schemas/GroupMember'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Group not found, or caller isn't org-admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Group not found
    post:
      tags: [Groups]
      operationId: addGroupMember
      summary: Add a member to a group
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "201":
          description: Added — returns the full updated member list, not just the new member.
