openapi: 3.1.0
info:
  title: EnvHQ API
  version: "0.1.0"
  license:
    name: Elastic-2.0
    identifier: Elastic-2.0
  description: |
    Hand-written, spec-first contract for EnvHQ's Next.js API routes
    (ADR-010). This document describes the 34 route handlers under
    `apps/web/src/app/api` exactly as they behave today — it does not
    describe aspirational or planned behavior. Paths are unversioned,
    matching the current code; the `/api/v1` prefix decided in ADR-010 is a
    separate, not-yet-implemented change.

    Two authentication schemes are accepted interchangeably by nearly every
    route: a CLI personal access token (bearer) or an EnvHQ web session
    (cookie). The one exception, `POST /api/cli/token`, is deliberately
    public.
tags:
  - name: Cli
    description: CLI browser-login (PKCE loopback) exchange.
  - name: Ops
    description: >-
      Operational visibility (RM-18) — the uptime endpoint, and EnvHQ's own
      metrics. The metrics routes are staff-only and answer 404 to everyone
      else.
  - name: Environments
    description: Environment CRUD, variable commits, version history and rollback.
  - name: Groups
    description: Org-scoped named groups of users, for group-based access grants.
  - name: Me
    description: Caller identity.
  - name: Orgs
    description: Orgs (personal workspaces and teams) the caller belongs to, and team management.
  - name: Projects
    description: Project CRUD, access grants, and zero-knowledge DEK key management.
  - name: Tokens
    description: CLI personal access token management.
  - name: Users
    description: The caller's zero-knowledge identity (User Keypair material).
  - name: Vars
    description: Individual environment variable mutation.
servers:
  - url: /
    description: Same-origin (the Next.js app serves its own API routes).
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        CLI personal access token (PAT), sent as `Authorization: Bearer
        <token>`. Resolved in `apps/web/src/lib/auth.ts`'s `getUserId`.
        Tokens carry an optional project scope and a `read`/`write`
        capability enforced per-route.
    cookieAuth:
      type: apiKey
      in: cookie
      name: envhq_session
      description: EnvHQ's encrypted web session cookie, issued after OpenID Connect sign-in.
  parameters:
    idPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orgIdPathParam:
      name: id
      in: path
      required: true
      description: An org id (`org_…`), not a UUID.
      schema:
        type: string
    orgIdQueryParam:
      name: orgId
      in: query
      required: false
      description: >-
        Explicit org to act on. Falls back to the caller's personal org if
        omitted (`resolveRequestedOrgId`).
      schema:
        type: string
  responses:
    Unauthorized:
      description: >-
        No valid bearer token or session cookie was presented, OR a bearer
        token matched but is past its `expiresAt`. The two cases are
        distinguished by `error`'s exact value: `token_expired` tells the
        CLI to transparently re-run its browser login instead of treating
        the token as permanently invalid. Six published CLI versions branch
        on this literal string; it must never change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            noCredential:
              value: { error: Unauthorized }
            tokenExpired:
              value: { error: token_expired }
    ReadOnlyForbidden:
      description: The bearer token's capability is `read`; this route mutates state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: This token is read-only.
    TeamError:
      description: >-
        A team rule refused the request — e.g. it would leave a team with no
        admin, delete a team that still owns projects, or invite into a
        personal workspace — or the token can't manage teams. `error` says
        which, in words fit to show the user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: A team needs at least one admin. Make someone else admin first.
    TeamNotFound:
      description: >-
        The team doesn't exist, or the caller isn't a member of it — the same
        answer either way, so a stranger can't confirm a team exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: Team not found
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          const: true
    Role:
      type: string
      enum: [viewer, editor, admin]
    SubjectType:
      type: string
      enum: [user, group]
    EnvScope:
      type: [object, "null"]
      description: >-
        Per-environment role cap keyed by environment name (e.g. `{"prod":
        "viewer"}`); an environment absent from the map is uncapped. `null`
        means no restriction at all.
      additionalProperties:
        $ref: '#/components/schemas/Role'
    Project:
      type: object
      description: apps/web/src/db/schema.ts `projects`.
      required: [id, userId, orgId, name, keyVersion, keyRotationPending, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          description: Creator, audit-only.
        orgId:
          type: string
        name:
          type: string
        keyVersion:
          type: integer
          description: DEK generation counter, bumped only by a completed rotation finalize.
        keyRotationPending:
          type: boolean
          description: Soft hint that a rotation is recommended (a revoke happened since the last one).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Environment:
      type: object
      description: apps/web/src/db/schema.ts `environments`.
      required: [id, projectId, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          description: Server-owned linear version counter, bumped only via commit's atomic CAS update.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EncryptedPair:
      type: object
      description: A single key's ciphertext, as the server stores and returns it — it cannot decrypt this.
      required: [key, ciphertext, iv]
      properties:
        key:
          type: string
        ciphertext:
          type: string
        iv:
          type: string
          description: AEAD nonce (legacy column name predates XChaCha20-Poly1305 adoption).
    EncryptedVarRow:
      description: "`EncryptedPair` plus its row id and last-write timestamp."
      allOf:
        - $ref: '#/components/schemas/EncryptedPair'
        - type: object
          required: [id, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            updatedAt:
              type: string
              format: date-time
    EnvironmentVersionSummary:
      type: object
      required: [version, message, createdBy, createdByName, createdAt]
      properties:
        version:
          type: integer
        message:
          type: [string, "null"]
        createdBy:
          type: string
          description: A user id — the identity provider's `sub`.
        createdByName:
          type: string
          description: Resolved display name for `createdBy` (`resolveDisplayNames`).
        createdAt:
          type: string
          format: date-time
    VersionConflictWithPairs:
      type: object
      description: >-
        The CAS-loss 409 shape unique to `commit` — includes the live
        ciphertext for just the keys the caller was trying to change, so the
        CLI can build a yours-vs-server diff without the server ever
        decrypting anything.
      required: [error, currentVersion, serverPairs]
      properties:
        error:
          const: version_conflict
        currentVersion:
          type: integer
        serverPairs:
          type: array
          items:
            $ref: '#/components/schemas/EncryptedPair'
    VersionConflictSimple:
      type: object
      description: >-
        The CAS-loss 409 shape unique to `rollback` — no `serverPairs`,
        since a rollback conflict is whole-environment, not per-key.
      required: [error, currentVersion]
      properties:
        error:
          const: version_conflict
        currentVersion:
          type: integer
    AccessGrant:
      type: object
      description: apps/web/src/lib/grants.ts `GrantRow`, with its resolved display name.
      required: [id, subjectType, subjectId, role, envScope, createdAt, name]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
          description: A user id, or a group id, depending on `subjectType`.
        role:
          $ref: '#/components/schemas/Role'
        envScope:
          $ref: '#/components/schemas/EnvScope'
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          description: Resolved display name (user, or group name).
    Group:
      type: object
      description: apps/web/src/lib/groups.ts `GroupRow`.
      required: [id, name, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    GroupMember:
      type: object
      required: [userId, name, createdAt]
      properties:
        userId:
          type: string
        name:
          type: string
          description: Resolved display name.
        createdAt:
          type: string
          format: date-time
    OrgMember:
      type: object
      description: An org member with display fields, shared shape between org members and project access members. Labels come from the local user_profiles mirror.
      required: [userId, name, email, imageUrl]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        imageUrl:
          type: string
    OrgMemberWithRole:
      allOf:
        - $ref: '#/components/schemas/OrgMember'
        - type: object
          required: [role]
          properties:
            role:
              enum: [admin, member]
    OrgInvite:
      type: object
      description: A pending invite link. The token itself is only ever returned once, as `url`, when the invite is created.
      required: [id, role, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Org:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, member]
    ApiTokenSummary:
      type: object
      description: A token list row — never includes the secret.
      required: [id, name, kind, capability, projectId, projectName, expiresAt, lastUsedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [pat, cli_session]
        capability:
          type: string
          enum: [read, write]
        projectId:
          type: [string, "null"]
          format: uuid
        projectName:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApiTokenCreated:
      type: object
      description: >-
        The one and only response that carries the plaintext secret — shown
        exactly once, never retrievable again.
      required: [token, id, name, capability, projectId, expiresAt, createdAt]
      properties:
        token:
          type: string
          description: Plaintext PAT. Only the SHA-256 hash is persisted server-side.
        id:
          type: string
          format: uuid
        name:
          type: string
        capability:
          type: string
          enum: [read, write]
        projectId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserKeysPublic:
      type: object
      description: >-
        A user's zero-knowledge identity (`apps/web/src/db/schema.ts`
        `userKeys`) — the server only ever holds ciphertext/public material
        here.
      required:
        - publicKey
        - kdfSalt
        - kdfT
        - kdfM
        - kdfP
        - wrappedPrivateKey
        - wrappedPrivateKeyNonce
        - wrappedPrivateKeyByRecovery
        - wrappedPrivateKeyByRecoveryNonce
        - createdAt
      properties:
        publicKey:
          type: string
        kdfSalt:
          type: string
        kdfT:
          type: integer
        kdfM:
          type: integer
        kdfP:
          type: integer
        wrappedPrivateKey:
          type: string
        wrappedPrivateKeyNonce:
          type: string
        wrappedPrivateKeyByRecovery:
          type: string
        wrappedPrivateKeyByRecoveryNonce:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectKeyNotFound:
      type: object
      description: >-
        Non-standard 404 body unique to `GET /api/projects/{id}/keys/me` —
        carries an extra field beyond the usual `{error}` envelope so the
        client can distinguish "nobody has a key on this project yet" from
        "you specifically aren't wrapped in yet." Modeled faithfully, not
        collapsed into `ErrorEnvelope`.
      required: [error, anyKeyExists]
      properties:
        error:
          type: string
        anyKeyExists:
          type: boolean
    Health:
      type: object
      required: [ok, database, latencyMs]
      properties:
        ok:
          type: boolean
        database:
          type: string
          enum: [ok, down]
        auth:
          type: string
          enum: [ok, rejected, down]
          description: >-
            Present only when a bearer token was supplied. `rejected` means
            the monitor's own credential is bad (401); `down` means the
            service could not evaluate it at all (503).
        latencyMs:
          type: integer
    OpsIssue:
      type: object
      required: [fingerprint, route, kind, message, occurrences, firstSeenAt, lastSeenAt, release, muted]
      properties:
        fingerprint:
          type: string
        route:
          type: string
        kind:
          type: string
        message:
          type: string
          description: Scrubbed and truncated. Never carries ciphertext, a token or a variable name.
        occurrences:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        release:
          type: [string, "null"]
        muted:
          type: boolean
    OpsMetrics:
      type: object
      required: [generatedAt, growth, usage, health, recentIssues]
      properties:
        generatedAt:
          type: string
          format: date-time
        growth:
          type: object
          required: [totalUsers, newUsers7d, newUsers30d, activeOrgs]
          properties:
            totalUsers:
              type: integer
            newUsers7d:
              type: integer
            newUsers30d:
              type: integer
            activeOrgs:
              type: integer
        usage:
          type: object
          required: [projects, environments, variables, tokensActive24h, tokensActive7d, deployKeysActive, deployKeysRevoked, deployKeysUsed24h]
          properties:
            projects:
              type: integer
            environments:
              type: integer
            variables:
              type: integer
            tokensActive24h:
              type: integer
            tokensActive7d:
              type: integer
            deployKeysActive:
              type: integer
            deployKeysRevoked:
              type: integer
            deployKeysUsed24h:
              type: integer
        health:
          type: object
          required: [webhookDeliveries24h, issues24h, unmutedIssues]
          properties:
            webhookDeliveries24h:
              type: integer
            issues24h:
              type: integer
            unmutedIssues:
              type: integer
        recentIssues:
          type: array
          items:
            $ref: '#/components/schemas/OpsIssue'
    DeployKey:
      type: object
      description: >-
        A machine credential for a CI pipeline. Only the public half exists
        server-side; the private half was shown once at creation and cannot
        be recovered.
      required: [id, label, environmentId, environmentName, publicKey, createdByUserId, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        environmentId:
          type: [string, "null"]
          format: uuid
          description: null = the whole project. An authorization cap, not an isolation boundary.
        environmentName:
          type: [string, "null"]
        publicKey:
          type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    ProjectMemberKey:
      type: object
      required: [userId, publicKey]
      properties:
        userId:
          type: string
        publicKey:
          type: string
    RotationStatus:
      type: object
      required: [currentKeyVersion, rotationPending]
      properties:
        currentKeyVersion:
          type: integer
        rotationPending:
          type: boolean
paths:
  /api/cli/authorize:
    post:
      tags: [Cli]
      operationId: authorizeCli
      summary: Mint a one-time CLI login code
      description: >-
        Called by the browser-based CLI-approve page once the user is
        signed in. Mints a single-use PKCE-bound code the browser hands back
        to the CLI's loopback listener.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, codeChallenge, port]
              properties:
                state:
                  type: string
                codeChallenge:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: The CLI's loopback listener port.
      responses:
        "200":
          description: Code minted.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
        "400":
          description: Missing/invalid state, codeChallenge, or port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFields:
                  value: { error: state and codeChallenge are required }
                badPort:
                  value: { error: port must be a valid loopback port }
        "401":
          $ref: '#/components/responses/Unauthorized'
  /api/cli/token:
    post:
      tags: [Cli]
      operationId: exchangeCliToken
      summary: Exchange a one-time code + PKCE verifier for a CLI session token
      security: []
      description: >-
        Deliberately public — no cookie/bearer auth. Security comes from the
        code being single-use and bound to the verifier, which never left
        the CLI. Every failure reason (unknown code, consumed code, expired
        code, PKCE mismatch) collapses into one opaque `invalid_grant` error
        so the response can't be used as an oracle for which check failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code:
                  type: string
                verifier:
                  type: string
      responses:
        "200":
          description: A 7-day CLI session token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, userId]
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  userId:
                    type: string
        "400":
          description: Missing fields, or the code/verifier pair is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFields:
                  value: { error: code and verifier are required }
                invalidGrant:
                  value: { error: invalid_grant }
  /api/environments/{id}/commit:
    post:
      tags: [Environments]
      operationId: commitEnvironment
      summary: Atomically apply an upsert/delete batch and bump the environment's version
      description: >-
        Ciphertext-only three-way commit. Requires editor role. On a lost
        compare-and-swap, returns the live ciphertext for just the keys the
        caller touched so the CLI can build a diff.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion:
                  type: integer
                upsert:
                  type: array
                  default: []
                  items:
                    $ref: '#/components/schemas/EncryptedPair'
                delete:
                  type: array
                  default: []
                  items:
                    type: string
                message:
                  type: [string, "null"]
      responses:
        "200":
          description: Commit applied.
          content:
            application/json:
              schema:
                type: object
                required: [version, created, updated, deleted]
                properties:
                  version:
                    type: integer
                  created:
                    type: integer
                  updated:
                    type: integer
                  deleted:
                    type: integer
        "400":
          description: baseVersion missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: baseVersion is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
        "409":
          description: Lost the compare-and-swap against `baseVersion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConflictWithPairs'
  /api/health:
    get:
      tags: [Ops]
      operationId: health
      summary: Liveness, for an uptime monitor
      description: >-
        Unauthenticated, this reports whether the process is up and can reach
        the database, and deliberately nothing else — a health endpoint that
        enumerated versions or dependencies would be free reconnaissance.
        With a bearer token it additionally exercises the authentication
        path, so a monitor notices an auth outage instead of reporting green
        while every customer is locked out. Never cached.
      security: []
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        "401":
          description: >-
            A bearer token was presented and did not resolve. The monitor's
            credential has expired or been revoked — a misconfiguration on
            its side, deliberately not reported as an outage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        "503":
          description: The database is unreachable, or the token path could not be evaluated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/ops/metrics:
    get:
      tags: [Ops]
      operationId: opsMetrics
      summary: EnvHQ's own growth, usage and health numbers
      description: >-
        Staff only. A non-staff caller gets 404 rather than 403, matching the
        rule used everywhere else: probing for an admin surface tells you
        nothing a stranger wouldn't learn.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMetrics'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Not staff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Not found
  /api/ops/issues/{fingerprint}:
    patch:
      tags: [Ops]
      operationId: setIssueMuted
      summary: Mute or unmute a known issue
      description: >-
        An alert that fires constantly is an alert nobody reads, and the
        usual cause is a known failure nobody can silence. Reversible.
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted]
              properties:
                muted:
                  type: boolean
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [ok, muted]
                properties:
                  ok:
                    type: boolean
                  muted:
                    type: boolean
        "400":
          description: "`muted` was missing or not a boolean."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: muted must be a boolean
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Not staff, or no such issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Issue not found
  /api/environments/{id}/export:
    get:
      tags: [Environments]
      operationId: exportEnvironment
      summary: Export an environment's active variables as ciphertext
      description: >-
        With `X-EnvHQ-Deploy-Key` set this is also the CI path: the response
        additionally carries the project DEK sealed to that deploy key, plus
        the DEK generation the ciphertext belongs to. Both authorizations
        must pass — the bearer token to read the environment, the deploy key
        to receive a wrap — and a token alone still yields only ciphertext.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: X-EnvHQ-Deploy-Key
          in: header
          required: false
          description: >-
            Base64 X25519 **public** half of a deploy key on this project. A
            header rather than a query parameter so it stays out of access
            and proxy logs.
          schema:
            type: string
      responses:
        "200":
          description: Ciphertext pairs — decrypted client-side.
          content:
            application/json:
              schema:
                type: object
                required: [pairs, count, version]
                properties:
                  pairs:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncryptedPair'
                  count:
                    type: integer
                  version:
                    type: integer
                  wrappedDek:
                    type: string
                    description: >-
                      Present only when a valid deploy key was presented. The
                      project DEK sealed to it; only its private half opens
                      this, and the server never held that half.
                  keyVersion:
                    type: integer
                    description: >-
                      Present only alongside `wrappedDek`. Which DEK
                      generation `pairs` and `wrappedDek` belong to, so a
                      long-running job can tell a mid-job rotation apart from
                      a corrupt value.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: >-
            The presented deploy key is unknown, revoked, or capped to a
            different environment. Unknown and revoked answer identically on
            purpose.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This deploy key is not valid for this project.
        "404":
          description: Environment not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
  /api/environments/{id}/import:
    post:
      tags: [Environments]
      operationId: importEnvironmentVars
      summary: Upsert a batch of already-encrypted pairs, committing a new version
      description: >-
        Optimistic commit against the environment's current version (the
        caller doesn't supply `baseVersion`), so a concurrent write in
        between surfaces as the generic version-conflict shape rather than
        the caller's own stale read.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs]
              properties:
                pairs:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/EncryptedPair'
      responses:
        "200":
          description: Import applied.
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, total]
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  total:
                    type: integer
        "400":
          description: pairs missing or empty after filtering malformed entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: pairs is required
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
        "409":
          description: The environment changed between the caller's read and this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
  /api/environments/{id}:
    get:
      tags: [Environments]
