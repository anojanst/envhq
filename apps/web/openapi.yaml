openapi: 3.1.0
info:
  title: EnvHQ API
  version: "0.1.0"
  license:
    name: Elastic-2.0
    identifier: Elastic-2.0
  description: |
    Hand-written, spec-first contract for EnvHQ's Next.js API routes
    (ADR-010). This document describes the 34 route handlers under
    `apps/web/src/app/api` exactly as they behave today — it does not
    describe aspirational or planned behavior. Paths are unversioned,
    matching the current code; the `/api/v1` prefix decided in ADR-010 is a
    separate, not-yet-implemented change.

    Two authentication schemes are accepted interchangeably by nearly every
    route: a CLI personal access token (bearer) or a Clerk web session
    (cookie). The one exception, `POST /api/cli/token`, is deliberately
    public.
tags:
  - name: Cli
    description: CLI browser-login (PKCE loopback) exchange.
  - name: Environments
    description: Environment CRUD, variable commits, version history and rollback.
  - name: Groups
    description: Org-scoped named groups of users, for group-based access grants.
  - name: Me
    description: Caller identity.
  - name: Orgs
    description: Clerk organizations the caller belongs to.
  - name: Projects
    description: Project CRUD, access grants, and zero-knowledge DEK key management.
  - name: Tokens
    description: CLI personal access token management.
  - name: Users
    description: The caller's zero-knowledge identity (User Keypair material).
  - name: Vars
    description: Individual environment variable mutation.
servers:
  - url: /
    description: Same-origin (the Next.js app serves its own API routes).
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        CLI personal access token (PAT), sent as `Authorization: Bearer
        <token>`. Resolved in `apps/web/src/lib/auth.ts`'s `getUserId`.
        Tokens carry an optional project scope and a `read`/`write`
        capability enforced per-route.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk web session cookie, used by the browser app.
  parameters:
    idPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orgIdQueryParam:
      name: orgId
      in: query
      required: false
      description: >-
        Explicit org to act on. Falls back to the caller's personal org if
        omitted (`resolveRequestedOrgId`).
      schema:
        type: string
  responses:
    Unauthorized:
      description: >-
        No valid bearer token or session cookie was presented, OR a bearer
        token matched but is past its `expiresAt`. The two cases are
        distinguished by `error`'s exact value: `token_expired` tells the
        CLI to transparently re-run its browser login instead of treating
        the token as permanently invalid. Six published CLI versions branch
        on this literal string; it must never change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            noCredential:
              value: { error: Unauthorized, code: unauthorized }
            tokenExpired:
              value: { error: token_expired, code: token_expired }
    ReadOnlyForbidden:
      description: The bearer token's capability is `read`; this route mutates state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: This token is read-only.
            code: forbidden
  schemas:
    ErrorCode:
      type: string
      description: >-
        Machine-readable companion to `error` (ADR-010), additive alongside
        the existing human-readable string. A closed enum — clients should
        treat an unrecognized value as a plain failure rather than erroring.
      enum:
        - unauthorized
        - token_expired
        - forbidden
        - not_found
        - bad_request
        - conflict
        - version_conflict
    ErrorEnvelope:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          const: true
    Role:
      type: string
      enum: [viewer, editor, admin]
    SubjectType:
      type: string
      enum: [user, group]
    EnvScope:
      type: [object, "null"]
      description: >-
        Per-environment role cap keyed by environment name (e.g. `{"prod":
        "viewer"}`); an environment absent from the map is uncapped. `null`
        means no restriction at all.
      additionalProperties:
        $ref: '#/components/schemas/Role'
    Project:
      type: object
      description: apps/web/src/db/schema.ts `projects`.
      required: [id, userId, orgId, name, keyVersion, keyRotationPending, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          description: Creator, audit-only.
        orgId:
          type: string
        name:
          type: string
        keyVersion:
          type: integer
          description: DEK generation counter, bumped only by a completed rotation finalize.
        keyRotationPending:
          type: boolean
          description: Soft hint that a rotation is recommended (a revoke happened since the last one).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Environment:
      type: object
      description: apps/web/src/db/schema.ts `environments`.
      required: [id, projectId, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
          description: Server-owned linear version counter, bumped only via commit's atomic CAS update.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EncryptedPair:
      type: object
      description: A single key's ciphertext, as the server stores and returns it — it cannot decrypt this.
      required: [key, ciphertext, iv]
      properties:
        key:
          type: string
        ciphertext:
          type: string
        iv:
          type: string
          description: AEAD nonce (legacy column name predates XChaCha20-Poly1305 adoption).
    EncryptedVarRow:
      description: "`EncryptedPair` plus its row id and last-write timestamp."
      allOf:
        - $ref: '#/components/schemas/EncryptedPair'
        - type: object
          required: [id, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            updatedAt:
              type: string
              format: date-time
    EnvironmentVersionSummary:
      type: object
      required: [version, message, createdBy, createdByName, createdAt]
      properties:
        version:
          type: integer
        message:
          type: [string, "null"]
        createdBy:
          type: string
          description: Clerk user id.
        createdByName:
          type: string
          description: Resolved display name for `createdBy` (`resolveDisplayNames`).
        createdAt:
          type: string
          format: date-time
    VersionConflictWithPairs:
      type: object
      description: >-
        The CAS-loss 409 shape unique to `commit` — includes the live
        ciphertext for just the keys the caller was trying to change, so the
        CLI can build a yours-vs-server diff without the server ever
        decrypting anything.
      required: [error, code, currentVersion, serverPairs]
      properties:
        error:
          const: version_conflict
        code:
          const: version_conflict
        currentVersion:
          type: integer
        serverPairs:
          type: array
          items:
            $ref: '#/components/schemas/EncryptedPair'
    VersionConflictSimple:
      type: object
      description: >-
        The CAS-loss 409 shape unique to `rollback` — no `serverPairs`,
        since a rollback conflict is whole-environment, not per-key.
      required: [error, code, currentVersion]
      properties:
        error:
          const: version_conflict
        code:
          const: version_conflict
        currentVersion:
          type: integer
    AccessGrant:
      type: object
      description: apps/web/src/lib/grants.ts `GrantRow`, with its resolved display name.
      required: [id, subjectType, subjectId, role, envScope, createdAt, name]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
          description: A Clerk user id, or a group id, depending on `subjectType`.
        role:
          $ref: '#/components/schemas/Role'
        envScope:
          $ref: '#/components/schemas/EnvScope'
        createdAt:
          type: string
          format: date-time
        name:
          type: string
          description: Resolved display name (Clerk user, or group name).
    Group:
      type: object
      description: apps/web/src/lib/groups.ts `GroupRow`.
      required: [id, name, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    GroupMember:
      type: object
      required: [userId, name, createdAt]
      properties:
        userId:
          type: string
        name:
          type: string
          description: Resolved display name.
        createdAt:
          type: string
          format: date-time
    OrgMember:
      type: object
      description: Clerk-derived membership row, shared shape between org members and project access members.
      required: [userId, name, email, imageUrl]
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        imageUrl:
          type: string
    Org:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, member]
    ApiTokenSummary:
      type: object
      description: A token list row — never includes the secret.
      required: [id, name, kind, capability, projectId, projectName, expiresAt, lastUsedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [pat, cli_session]
        capability:
          type: string
          enum: [read, write]
        projectId:
          type: [string, "null"]
          format: uuid
        projectName:
          type: [string, "null"]
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    ApiTokenCreated:
      type: object
      description: >-
        The one and only response that carries the plaintext secret — shown
        exactly once, never retrievable again.
      required: [token, id, name, capability, projectId, expiresAt, createdAt]
      properties:
        token:
          type: string
          description: Plaintext PAT. Only the SHA-256 hash is persisted server-side.
        id:
          type: string
          format: uuid
        name:
          type: string
        capability:
          type: string
          enum: [read, write]
        projectId:
          type: [string, "null"]
          format: uuid
        expiresAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserKeysPublic:
      type: object
      description: >-
        A user's zero-knowledge identity (`apps/web/src/db/schema.ts`
        `userKeys`) — the server only ever holds ciphertext/public material
        here.
      required:
        - publicKey
        - kdfSalt
        - kdfT
        - kdfM
        - kdfP
        - wrappedPrivateKey
        - wrappedPrivateKeyNonce
        - wrappedPrivateKeyByRecovery
        - wrappedPrivateKeyByRecoveryNonce
        - createdAt
      properties:
        publicKey:
          type: string
        kdfSalt:
          type: string
        kdfT:
          type: integer
        kdfM:
          type: integer
        kdfP:
          type: integer
        wrappedPrivateKey:
          type: string
        wrappedPrivateKeyNonce:
          type: string
        wrappedPrivateKeyByRecovery:
          type: string
        wrappedPrivateKeyByRecoveryNonce:
          type: string
        createdAt:
          type: string
          format: date-time
    ProjectKeyNotFound:
      type: object
      description: >-
        Non-standard 404 body unique to `GET /api/projects/{id}/keys/me` —
        carries an extra field beyond the usual `{error}` envelope so the
        client can distinguish "nobody has a key on this project yet" from
        "you specifically aren't wrapped in yet." Modeled faithfully, not
        collapsed into `ErrorEnvelope`.
      required: [error, code, anyKeyExists]
      properties:
        error:
          type: string
        code:
          const: not_found
        anyKeyExists:
          type: boolean
    ProjectMemberKey:
      type: object
      required: [userId, publicKey]
      properties:
        userId:
          type: string
        publicKey:
          type: string
    RotationStatus:
      type: object
      required: [currentKeyVersion, rotationPending]
      properties:
        currentKeyVersion:
          type: integer
        rotationPending:
          type: boolean
paths:
  /api/cli/authorize:
    post:
      tags: [Cli]
      operationId: authorizeCli
      summary: Mint a one-time CLI login code
      description: >-
        Called by the browser-based CLI-approve page once the user is
        signed in. Mints a single-use PKCE-bound code the browser hands back
        to the CLI's loopback listener.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, codeChallenge, port]
              properties:
                state:
                  type: string
                codeChallenge:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: The CLI's loopback listener port.
      responses:
        "200":
          description: Code minted.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
        "400":
          description: Missing/invalid state, codeChallenge, or port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFields:
                  value: { error: state and codeChallenge are required, code: bad_request }
                badPort:
                  value: { error: port must be a valid loopback port, code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
  /api/cli/token:
    post:
      tags: [Cli]
      operationId: exchangeCliToken
      summary: Exchange a one-time code + PKCE verifier for a CLI session token
      security: []
      description: >-
        Deliberately public — no cookie/bearer auth. Security comes from the
        code being single-use and bound to the verifier, which never left
        the CLI. Every failure reason (unknown code, consumed code, expired
        code, PKCE mismatch) collapses into one opaque `invalid_grant` error
        so the response can't be used as an oracle for which check failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, verifier]
              properties:
                code:
                  type: string
                verifier:
                  type: string
      responses:
        "200":
          description: A 7-day CLI session token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, userId]
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  userId:
                    type: string
        "400":
          description: Missing fields, or the code/verifier pair is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missingFields:
                  value: { error: code and verifier are required, code: bad_request }
                invalidGrant:
                  value: { error: invalid_grant, code: bad_request }
  /api/environments/{id}/commit:
    post:
      tags: [Environments]
      operationId: commitEnvironment
      summary: Atomically apply an upsert/delete batch and bump the environment's version
      description: >-
        Ciphertext-only three-way commit. Requires editor role. On a lost
        compare-and-swap, returns the live ciphertext for just the keys the
        caller touched so the CLI can build a diff.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion:
                  type: integer
                upsert:
                  type: array
                  default: []
                  items:
                    $ref: '#/components/schemas/EncryptedPair'
                delete:
                  type: array
                  default: []
                  items:
                    type: string
                message:
                  type: [string, "null"]
      responses:
        "200":
          description: Commit applied.
          content:
            application/json:
              schema:
                type: object
                required: [version, created, updated, deleted]
                properties:
                  version:
                    type: integer
                  created:
                    type: integer
                  updated:
                    type: integer
                  deleted:
                    type: integer
        "400":
          description: baseVersion missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: baseVersion is required
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
        "409":
          description: Lost the compare-and-swap against `baseVersion`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConflictWithPairs'
  /api/environments/{id}/export:
    get:
      tags: [Environments]
      operationId: exportEnvironment
      summary: Export an environment's active variables as ciphertext
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Ciphertext pairs — decrypted client-side.
          content:
            application/json:
              schema:
                type: object
                required: [pairs, count, version]
                properties:
                  pairs:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncryptedPair'
                  count:
                    type: integer
                  version:
                    type: integer
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Environment not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
  /api/environments/{id}/import:
    post:
      tags: [Environments]
      operationId: importEnvironmentVars
      summary: Upsert a batch of already-encrypted pairs, committing a new version
      description: >-
        Optimistic commit against the environment's current version (the
        caller doesn't supply `baseVersion`), so a concurrent write in
        between surfaces as the generic version-conflict shape rather than
        the caller's own stale read.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs]
              properties:
                pairs:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/EncryptedPair'
      responses:
        "200":
          description: Import applied.
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, total]
                properties:
                  created:
                    type: integer
                  updated:
                    type: integer
                  total:
                    type: integer
        "400":
          description: pairs missing or empty after filtering malformed entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: pairs is required
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
        "409":
          description: The environment changed between the caller's read and this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
                code: conflict
  /api/environments/{id}:
    get:
      tags: [Environments]
      operationId: getEnvironment
      summary: Fetch an environment, its project, and its active variables
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [environment, project, vars]
                properties:
                  environment:
                    $ref: '#/components/schemas/Environment'
                  project:
                    $ref: '#/components/schemas/Project'
                  vars:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncryptedVarRow'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Environment not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
    patch:
      tags: [Environments]
      operationId: renameEnvironment
      summary: Rename an environment
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [environment]
                properties:
                  environment:
                    $ref: '#/components/schemas/Environment'
        "400":
          description: name missing/blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: name is required
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
        "409":
          description: Another environment in the project already has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: An environment named "prod" already exists in this project
                code: conflict
    delete:
      tags: [Environments]
      operationId: deleteEnvironment
      summary: Delete an environment
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
  /api/environments/{id}/vars:
    post:
      tags: [Environments]
      operationId: upsertEnvironmentVar
      summary: Create or update a single variable
      description: >-
        The only operation whose success status varies: `201` when the key
        didn't exist yet, `200` when it did. Bumps the environment's version
        via the same optimistic-commit path as import.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, ciphertext, iv]
              properties:
                key:
                  type: string
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                ciphertext:
                  type: string
                iv:
                  type: string
      responses:
        "200":
          description: Existing key updated.
          content:
            application/json:
              schema:
                type: object
                required: [key, created]
                properties:
                  key:
                    type: string
                  created:
                    const: false
        "201":
          description: New key created.
          content:
            application/json:
              schema:
                type: object
                required: [key, created]
                properties:
                  key:
                    type: string
                  created:
                    const: true
        "400":
          description: Missing key/ciphertext/iv, or key fails the identifier pattern.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                keyRequired:
                  value: { error: key is required, code: bad_request }
                keyFormat:
                  value: { error: "key must start with a letter or _ and contain only letters, digits, _", code: bad_request }
                valueRequired:
                  value: { error: ciphertext and iv are required, code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
                code: not_found
        "409":
          description: The environment changed between the caller's read and this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
                code: conflict
  /api/environments/{id}/versions/{version}/rollback:
    post:
      tags: [Environments]
      operationId: rollbackEnvironment
      summary: Roll back to a historical version
      description: >-
        Implemented as a new forward version (git-revert style), not a
        reset — the version counter only ever increases.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion:
                  type: integer
                message:
                  type: [string, "null"]
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        "400":
          description: Invalid version path param, or baseVersion missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidVersion:
                  value: { error: Invalid version, code: bad_request }
                baseVersionRequired:
                  value: { error: baseVersion is required, code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or the target version's snapshot doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                environmentNotFound:
                  value: { error: Environment not found, code: not_found }
                versionNotFound:
                  value: { error: "Version 3 not found", code: not_found }
        "409":
          description: >-
            Either the target version predates a key rotation and can no
            longer be decrypted, or a lost compare-and-swap against
            `baseVersion`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/VersionConflictSimple'
              examples:
                retiredKey:
                  value:
                    error: This version predates a key rotation and can no longer be restored — its values are encrypted under a retired key.
                    code: conflict
                versionConflict:
                  value: { error: version_conflict, currentVersion: 7, code: version_conflict }
