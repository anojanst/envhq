                error: An environment named "prod" already exists in this project
    delete:
      tags: [Environments]
      operationId: deleteEnvironment
      summary: Delete an environment
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
  /api/environments/{id}/vars:
    post:
      tags: [Environments]
      operationId: upsertEnvironmentVar
      summary: Create or update a single variable
      description: >-
        The only operation whose success status varies: `201` when the key
        didn't exist yet, `200` when it did. Bumps the environment's version
        via the same optimistic-commit path as import.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, ciphertext, iv]
              properties:
                key:
                  type: string
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                ciphertext:
                  type: string
                iv:
                  type: string
      responses:
        "200":
          description: Existing key updated.
          content:
            application/json:
              schema:
                type: object
                required: [key, created]
                properties:
                  key:
                    type: string
                  created:
                    const: false
        "201":
          description: New key created.
          content:
            application/json:
              schema:
                type: object
                required: [key, created]
                properties:
                  key:
                    type: string
                  created:
                    const: true
        "400":
          description: Missing key/ciphertext/iv, or key fails the identifier pattern.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                keyRequired:
                  value: { error: key is required }
                keyFormat:
                  value: { error: "key must start with a letter or _ and contain only letters, digits, _" }
                valueRequired:
                  value: { error: ciphertext and iv are required }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
        "409":
          description: The environment changed between the caller's read and this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
  /api/environments/{id}/versions/{version}/rollback:
    post:
      tags: [Environments]
      operationId: rollbackEnvironment
      summary: Roll back to a historical version
      description: >-
        Implemented as a new forward version (git-revert style), not a
        reset — the version counter only ever increases.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                baseVersion:
                  type: integer
                message:
                  type: [string, "null"]
      responses:
        "200":
          description: Rolled back.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: integer
        "400":
          description: Invalid version path param, or baseVersion missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidVersion:
                  value: { error: Invalid version }
                baseVersionRequired:
                  value: { error: baseVersion is required }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Environment not found, or the target version's snapshot doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                environmentNotFound:
                  value: { error: Environment not found }
                versionNotFound:
                  value: { error: "Version 3 not found" }
        "409":
          description: >-
            Either the target version predates a key rotation and can no
            longer be decrypted, or a lost compare-and-swap against
            `baseVersion`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - $ref: '#/components/schemas/VersionConflictSimple'
              examples:
                retiredKey:
                  value:
                    error: This version predates a key rotation and can no longer be restored — its values are encrypted under a retired key.
                versionConflict:
                  value: { error: version_conflict, currentVersion: 7 }
  /api/environments/{id}/versions:
    get:
      tags: [Environments]
      operationId: listEnvironmentVersions
      summary: List an environment's version history, newest first
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
