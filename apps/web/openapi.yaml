        "400":
          description: userId missing, or not a member of this org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                userIdRequired:
                  value: { error: userId is required }
                notOrgMember:
                  value: { error: "That user isn't a member of this org" }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Group not found, or caller isn't org-admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Group not found
  /api/groups/{id}:
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete a group
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
