      tags: [Projects]
      operationId: upsertProjectAccess
      summary: Grant (or update) a user's or group's role on a project
      description: >-
        Always returns 201, even when updating an existing grant's role.
        `envScope` is only applied when the key is present in the request
        body at all — omitting it leaves an existing grant's env-scope
        untouched; `null` or `{}` explicitly clears it.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, role]
              properties:
                subjectType:
                  $ref: '#/components/schemas/SubjectType'
                  default: user
