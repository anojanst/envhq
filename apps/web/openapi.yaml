                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnvironmentVersionSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Environment not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Environment not found
  /api/groups/{id}/members/{userId}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Remove a member from a group
      description: >-
        Requires org-admin on the group's org. Not found and
        not-authorized are indistinguishable (both 404) — deliberate,
        matching the same info-leak defense used project/environment-wide:
        a caller shouldn't learn a group id is real just because they lack
        admin rights on it.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Group not found (or caller isn't org-admin), or the user wasn't a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                groupNotFound:
                  value: { error: Group not found }
                notAMember:
                  value: { error: Member not found in this group }
  /api/groups/{id}/members:
    get:
      tags: [Groups]
      operationId: listGroupMembers
      summary: List a group's members
      parameters:
        - $ref: '#/components/parameters/idPathParam'
