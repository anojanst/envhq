  /api/projects/{id}/keys/rotate/finalize:
    post:
      tags: [Projects]
      operationId: finalizeProjectKeyRotation
      summary: Complete a DEK rotation
      description: >-
        The irreversible step: swaps every `project_keys` wrap to the new
        DEK and bumps `projects.keyVersion`. Only proceeds once every
        `env_vars` row is confirmed re-encrypted, and only accepts a wrap
        set that exactly matches the project's real current membership.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKeyVersion, wraps]
              properties:
                targetKeyVersion:
                  type: integer
                  minimum: 1
                wraps:
                  type: array
                  items:
                    type: object
                    required: [subjectUserId, wrappedDek]
                    properties:
                      subjectUserId:
                        type: string
                      wrappedDek:
                        type: string
      responses:
        "200":
          description: Rotation finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: Invalid targetKeyVersion or wraps shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                targetKeyVersion:
                  value: { error: targetKeyVersion must be a positive integer, code: bad_request }
                wrapsShape:
                  value: { error: "wraps must be an array of {subjectUserId, wrappedDek}", code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
        "409":
          description: Some variables still need migrating, or the supplied wraps don't match current membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                pendingMigration:
                  value: { error: "3 value(s) still need migrating before finalize", code: conflict }
                membershipMismatch:
                  value: { error: "The supplied key wraps don't match the project's current members — refresh and try again", code: conflict }
  /api/projects/{id}/keys/rotate:
    post:
      tags: [Projects]
      operationId: migrateProjectKeyBatch
      summary: Re-encrypt a batch of variables under a new DEK generation
      description: >-
        Chunked, idempotent/resumable batch step of a rotation. Doesn't
        touch `project_keys` or bump `projects.keyVersion` — see `finalize`.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKeyVersion, rows]
              properties:
                targetKeyVersion:
                  type: integer
                  minimum: 1
                rows:
                  type: array
                  items:
                    type: object
                    required: [id, ciphertext, iv]
                    properties:
                      id:
                        type: string
                        format: uuid
                      ciphertext:
                        type: string
                      iv:
                        type: string
      responses:
        "200":
          description: Batch migrated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, migrated]
                properties:
                  ok:
                    const: true
                  migrated:
                    type: integer
        "400":
          description: Invalid targetKeyVersion or rows shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                targetKeyVersion:
                  value: { error: targetKeyVersion must be a positive integer, code: bad_request }
                rowsShape:
                  value: { error: "rows must be an array of {id, ciphertext, iv}", code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
  /api/projects/{id}/keys/rotation-status:
    get:
      tags: [Projects]
      operationId: getProjectKeyRotationStatus
      summary: Fetch a project's current DEK generation and whether rotation is recommended
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller isn't admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
  /api/projects/{id}/keys:
    post:
      tags: [Projects]
      operationId: registerProjectKey
      summary: Register a wrapped DEK, for the caller or (with editor role) another authorized member
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrappedDek]
              properties:
                wrappedDek:
                  type: string
                subjectUserId:
                  type: string
                  description: Defaults to the caller. Registering for someone else requires editor role.
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: wrappedDek missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: wrappedDek is required
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The read-only PAT gate, or the target user doesn't have project access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                readOnly:
                  value: { error: This token is read-only., code: forbidden }
                targetNoAccess:
                  value: { error: "That user doesn't have access to this project", code: forbidden }
        "404":
          description: Project not found, or caller doesn't meet the required role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
        "409":
          description: A key is already registered for that user on this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A key is already registered for that user on this project
                code: conflict
  /api/projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Fetch a project and its environments
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [project, environments]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Environment'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Project not found, or caller lacks viewer role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
    patch:
      tags: [Projects]
      operationId: renameProject
      summary: Rename a project
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        "400":
          description: name missing/blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: name is required
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller lacks editor role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
        "409":
          description: Another project in the org already has this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A project named "Payments" already exists.
                code: conflict
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Project not found, or caller lacks admin role on it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Project not found
                code: not_found
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects the caller can access in an org
      description: CLI-only surface — the web dashboard reads `lib/access.ts` directly instead.
      parameters:
        - $ref: '#/components/parameters/orgIdQueryParam'
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller isn't a member of the requested org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: "You're not a member of that org."
                code: forbidden
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project, its initial environments, and any initial access grants
      description: >-
        The creator always receives an explicit admin grant, in addition to
        any `grants` requested. Defaults to a single `dev` environment;
        passing an empty `environments` array opts out entirely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                orgId:
                  type: string
                grants:
                  type: array
                  items:
                    type: object
                    required: [subjectId, role]
                    properties:
                      subjectType:
                        $ref: '#/components/schemas/SubjectType'
                        default: user
                      subjectId:
                        type: string
                      role:
                        $ref: '#/components/schemas/Role'
                environments:
                  type: array
                  default: [dev]
                  items:
                    type: string
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [project, environments]
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  environments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Environment'
        "400":
          description: Invalid name, or an initial grant's subject/role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameRequired:
                  value: { error: name is required, code: bad_request }
                grantShape:
                  value: { error: Each grant needs a subjectId and a valid role, code: bad_request }
                grantUserNotInOrg:
                  value: { error: "A granted user isn't a member of this org", code: bad_request }
                grantGroupNotInOrg:
                  value: { error: "A granted group doesn't belong to this org", code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: The token can't create projects, or the caller isn't a member of the requested org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                tokenScoped:
                  value: { error: This token can't create projects., code: forbidden }
                notOrgMember:
                  value: { error: "You're not a member of that org.", code: forbidden }
        "409":
          description: A project with this name already exists in the org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: A project named "Payments" already exists.
                code: conflict
  /api/tokens/{id}:
    delete:
      tags: [Tokens]
      operationId: deleteToken
      summary: Revoke one of the caller's own tokens
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A scoped/read-only token attempted to manage tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token can't manage tokens.
                code: forbidden
        "404":
          description: Token not found, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Token not found
                code: not_found
  /api/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List the caller's own tokens
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenSummary'
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Create a new personal access token
      description: The plaintext secret is returned exactly once, in this response only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                capability:
                  type: string
                  enum: [read, write]
                  default: write
                projectId:
                  type: string
                  format: uuid
                  description: Scopes the token to one project. Omit for an all-projects token.
                expiresInDays:
                  type: number
                  description: Omit or non-positive for a non-expiring token.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        "400":
          description: name missing, or projectId doesn't resolve to an accessible project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                nameRequired:
                  value: { error: name is required, code: bad_request }
                unknownProject:
                  value: { error: Unknown project, code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: A scoped/read-only token attempted to create another token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This token can't create tokens.
                code: forbidden
  /api/users/me/keys:
    get:
      tags: [Users]
      operationId: getMyUserKeys
      summary: Fetch the caller's zero-knowledge identity material
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserKeysPublic'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The caller hasn't completed zero-knowledge onboarding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Zero-knowledge identity not set up
                code: not_found
    post:
      tags: [Users]
      operationId: createMyUserKeys
      summary: One-time creation of the caller's zero-knowledge identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - publicKey
                - kdfSalt
                - kdfT
                - kdfM
                - kdfP
                - wrappedPrivateKey
                - wrappedPrivateKeyNonce
                - wrappedPrivateKeyByRecovery
                - wrappedPrivateKeyByRecoveryNonce
              properties:
                publicKey:
                  type: string
                kdfSalt:
                  type: string
                kdfT:
                  type: integer
                kdfM:
                  type: integer
                kdfP:
                  type: integer
                wrappedPrivateKey:
                  type: string
                wrappedPrivateKeyNonce:
                  type: string
                wrappedPrivateKeyByRecovery:
                  type: string
                wrappedPrivateKeyByRecoveryNonce:
                  type: string
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "400":
          description: Missing or invalid key material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Missing or invalid key material
                code: bad_request
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: The caller already has a zero-knowledge identity (no update path — one-time only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Zero-knowledge identity already set up
                code: conflict
  /api/vars/{id}:
    patch:
      tags: [Vars]
      operationId: updateVar
      summary: Update a variable's key and/or value
      description: >-
        All fields optional, but at least one of `key` or (`ciphertext` +
        `iv`) must be present. A rename to a key that collides with another
        active variable in the same environment is pre-checked and returned
        as a 409 before touching the version counter.
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                ciphertext:
                  type: string
                iv:
                  type: string
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [variable]
                properties:
                  variable:
                    type: object
                    required: [id, key]
                    properties:
                      id:
                        type: string
                        format: uuid
                      key:
                        type: string
        "400":
          description: Invalid key format, or no fields to update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidKey:
                  value: { error: Invalid key format, code: bad_request }
                nothingToUpdate:
                  value: { error: Nothing to update, code: bad_request }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Variable not found, or caller lacks editor role on its environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Variable not found
                code: not_found
        "409":
          description: The new key collides with an existing variable, or the environment changed underneath this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                keyCollision:
                  value: { error: A variable with that key already exists in this environment, code: conflict }
                versionConflict:
                  value: { error: This environment changed elsewhere — refresh and try again., code: conflict }
    delete:
      tags: [Vars]
      operationId: deleteVar
      summary: Soft-delete a variable
      parameters:
        - $ref: '#/components/parameters/idPathParam'
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/ReadOnlyForbidden'
        "404":
          description: Variable not found, or caller lacks editor role on its environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: Variable not found
                code: not_found
        "409":
          description: The environment changed underneath this write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: This environment changed elsewhere — refresh and try again.
                code: conflict
