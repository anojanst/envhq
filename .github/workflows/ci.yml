name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envhq_test
          POSTGRES_PASSWORD: envhq_test
          POSTGRES_DB: envhq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envhq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Next's compiler cache. Keyed on the lockfile plus the app sources, so
      # a dependency bump or a source change gets a fresh entry while the
      # restore-key still seeds it from the last build on this lockfile.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm --filter @envhq/web lint

      # Build precedes typecheck deliberately: `next-env.d.ts` imports
      # `.next/types/routes.d.ts`, which only exists once a build has
      # generated it, so `tsc --noEmit` cannot run against a clean checkout.
      - run: pnpm --filter @envhq/web build
        env:
          # Build-time-only placeholders so route/type analysis has something
          # to read — nothing here needs to resolve to a real service.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci-placeholder-not-a-real-secret

      # An explicit gate rather than relying on `next build` to keep doing it.
      # Next 16.3.5 does type-check test files and unreferenced sources, but
      # 16.2.10 — green on main until this commit — did not: `tsc --noEmit`
      # found two real errors in the authz test files that CI had been passing
      # over. Which files a framework's build step happens to check is not a
      # contract, so the check is stated here directly.
      - run: pnpm --filter @envhq/web typecheck

      - run: pnpm --filter @envhq/web test:coverage
        env:
          # Real Postgres for the authz-db and contract test projects (HQ-19),
          # distinct from the build-time DATABASE_URL above.
          TEST_DATABASE_URL: postgres://envhq_test:envhq_test@localhost:5432/envhq_test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter envhq typecheck
      - run: pnpm --filter envhq build
      # Builds again (fast) so the CLI-surface test runs against fresh dist/.
      - run: pnpm --filter envhq test

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @envhq/crypto typecheck
      - run: pnpm --filter @envhq/parser typecheck
      - run: pnpm --filter @envhq/crypto test
      - run: pnpm --filter @envhq/parser test
