name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: envhq_test
          POSTGRES_PASSWORD: envhq_test
          POSTGRES_DB: envhq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envhq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @envhq/web lint
      - run: pnpm --filter @envhq/web test
        env:
          # Real Postgres for the authz-db test project (HQ-19) — distinct
          # from production's DATABASE_URL, which uses Neon's neon-http
          # driver and can't talk to a plain Postgres. See vitest.config.mts.
          TEST_DATABASE_URL: postgres://envhq_test:envhq_test@localhost:5432/envhq_test
      - run: pnpm --filter @envhq/web build
        env:
          # Build-time-only placeholders so route/type analysis has something
          # to read — nothing here needs to resolve to a real service.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci-placeholder-not-a-real-secret

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter envhq typecheck
      - run: pnpm --filter envhq build

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @envhq/app lint
      - run: pnpm --filter @envhq/app typecheck
      - run: pnpm --filter @envhq/app build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA
          VITE_CLERK_FRONTEND_API_DOMAIN: ci-placeholder.clerk.accounts.dev

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @envhq/crypto test
      - run: pnpm --filter @envhq/parser test
