name: Release

# Tagging convention (see docs/RELEASE_POLICY.md): this workflow produces
# `envhq@X.Y.Z` tags for the publishable CLI package, via Changesets' own
# tagging. It is the only tag namespace in the repo.
#
# Publishing uses npm trusted publishing (OIDC): there is no npm token
# anywhere. npm trusts this exact workflow file in envhq/envhq, configured on
# npmjs.com under the `envhq` package → Settings → Trusted Publisher. Renaming
# this file or moving the repo breaks publishing until that entry is updated.
# `changeset publish` runs `pnpm publish`, which (pnpm 11) exchanges the job's
# OIDC token itself and gets provenance attached automatically.
#
# Repo setting this also relies on: Settings → Actions → General → "Allow
# GitHub Actions to create and approve pull requests", or the "Version
# Packages" PR has to be opened by hand from the changeset-release/main branch.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Release PR or publish to npm
        # v2, not v1: v1 found what was published by parsing `changeset
        # publish` output, which Changesets v3 changed, so it silently pushed no
        # tag and made no GitHub release (envhq@0.10.0 was tagged by hand).
        # v2 reads the CHANGESETS_OUTPUT file instead. Pinned to a commit.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
