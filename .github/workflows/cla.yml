name: CLA Assistant Lite

# Enforces a signed CLA (see ../../CONTRIBUTING.md, ../../ICLA.md,
# ../../CCLA.md) on every pull request via a required status check.
#
# One-time maintainer setup before this actually enforces anything:
#   1. Create a fine-grained GitHub Personal Access Token with "Contents"
#      read/write on this repository only (needed to commit signature
#      records to .github/cla-signatures.json).
#   2. Add it as a repository secret named CLA_ASSISTANT_LITE_PAT
#      (Settings -> Secrets and variables -> Actions).
#   3. In branch protection for `main`, mark the "CLA Assistant Lite" status
#      check as required, so an unsigned PR is actually blocked from merging.
#   4. Open one real test PR from an account that hasn't signed to confirm
#      the check blocks it, then sign and confirm it unblocks.
#
# Uses contributor-assistant/github-action — a self-contained Action with no
# third-party OAuth app to install, unlike the classic hosted CLA Assistant.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: |
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
           github.event.comment.body == 'recheck') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_LITE_PAT }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/anojanst/envhq/blob/main/ICLA.md"
          branch: "main"
          allowlist: dependabot[bot],renovate[bot]
          create-file-commit-message: "chore: create CLA signatures file"
          signed-commit-message: "chore: record CLA signature for $contributorName ($owner/$repo#$pullRequestNo)"
          custom-notsigned-prcomment: >
            Thanks for the contribution! EnvHQ requires a signed Contributor
            License Agreement before this can be merged — see
            [CONTRIBUTING.md](https://github.com/anojanst/envhq/blob/main/CONTRIBUTING.md)
            for why. Please read the [ICLA](https://github.com/anojanst/envhq/blob/main/ICLA.md)
            (or [CCLA](https://github.com/anojanst/envhq/blob/main/CCLA.md) if
            you're contributing on behalf of an employer), then reply to this
            comment with the exact phrase below to sign.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
          lock-pullrequest-aftermerge: false
